  /* الصفحة ليلية بالتصميم، فالألوان ثابتة في كل الأوضاع */
  :root {
    --night: #0E1B27;
    --pearl: #F6E8C6;
    --ivory: #F1EBDD;
    --mist: #9CB0BF;
    --rose: #E8909F;
    --rose-soft: #F6C3CB;
    --line: rgba(241, 235, 221, .16);
    --display: "Aref Ruqaa", "Amiri", "Noto Naskh Arabic", serif;
    --body: "Readex Pro", "Segoe UI", Tahoma, system-ui, sans-serif;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(90% 70% at 15% 100%, #1C3242 0%, transparent 70%), var(--night);
    color: var(--ivory);
    font-family: var(--body);
    font-size: 1rem;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* سماء الخلفية */
  .field { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .field i { position: absolute; border-radius: 50%; background: var(--pearl); }
  .field i.tw { animation: tw 6s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * .25); } }

  /* التخطيط */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: grid;
    grid-template-columns: 1fr;
    align-content: start;
    gap: 0;
    padding: 1.25rem 1.5rem 3rem;
  }
  .constellation { order: -1; height: 36vh; min-height: 14rem; margin: 0; }
  .constellation svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .panel { max-width: 34rem; transition: opacity .25s ease; }
  .panel.out { opacity: 0; }

  @media (min-width: 900px) {
    .stage {
      grid-template-columns: minmax(22rem, 34rem) 1fr;
      align-items: center;
      align-content: center;
      gap: 5vw;
      padding: 3rem 6vw;
    }
    .constellation { order: 0; height: min(72vh, 36rem); }
  }

  /* الكتابة */
  .display {
    font-family: var(--display);
    font-weight: 700;
    line-height: 1.6;
    margin: 0 0 1rem;
    color: var(--ivory);
    font-size: clamp(2rem, 5vw, 3.1rem);
  }
  .display.q { font-size: clamp(1.7rem, 4vw, 2.4rem); margin-bottom: 1.4rem; }
  .display:focus { outline: none; }
  .lead { font-size: 1.1rem; color: var(--mist); margin: 0 0 2rem; max-width: 30rem; }
  .progress { margin: 0 0 .6rem; font-size: .9rem; color: var(--mist); }

  /* الاختيارات */
  .opts { border-top: 1px solid var(--line); }
  .opt {
    display: flex;
    align-items: center;
    gap: .9rem;
    width: 100%;
    padding: 1rem .25rem;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--line);
    color: var(--ivory);
    font: inherit;
    font-size: 1.05rem;
    text-align: start;
    cursor: pointer;
    transition: opacity .3s ease;
  }
  .opt::before {
    content: "";
    flex: none;
    width: .7rem;
    height: .7rem;
    border: 1px solid var(--mist);
    border-radius: 50%;
    transition: background .25s ease, border-color .25s ease;
  }
  .opt:hover::before { border-color: var(--pearl); }
  .opt:focus-visible { outline: 2px solid var(--pearl); outline-offset: 2px; border-radius: .25rem; }
  .opt.chosen::before { background: var(--rose); border-color: var(--rose); }
  .opts.locked .opt { cursor: default; }
  .opts.locked .opt:not(.chosen) { opacity: .4; }

  .reaction {
    font-family: var(--display);
    font-size: 1.4rem;
    line-height: 1.7;
    color: var(--pearl);
    margin: 1.2rem 0 0;
    min-height: 3.6rem;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .reaction.show { opacity: 1; transform: none; }
  .slot { min-height: 3.4rem; margin-top: .6rem; }

  .cta {
    display: inline-block;
    padding: .75rem 1.9rem;
    background: var(--rose);
    color: #24101A;
    border: 0;
    border-radius: .35rem;
    font: inherit;
    font-weight: 500;
    font-size: 1.05rem;
    cursor: pointer;
    transition: background .2s ease;
  }
  .cta:hover { background: var(--rose-soft); }
  .cta:focus-visible, .ghost:focus-visible { outline: 2px solid var(--pearl); outline-offset: 3px; }
  .ghost {
    background: none;
    border: 0;
    border-bottom: 1px solid var(--mist);
    color: var(--mist);
    font: inherit;
    font-size: .95rem;
    padding: 0 0 .1rem;
    cursor: pointer;
  }
  .ghost:hover { color: var(--ivory); border-color: var(--ivory); }

  .letter p { font-size: 1.12rem; line-height: 2.05; margin: 0 0 1rem; color: var(--ivory); }
  .ps { font-size: 1rem; color: var(--mist); margin: 0; }
  .sign { font-family: var(--display); font-size: 2rem; color: var(--rose); margin: 1.2rem 0 2rem; }

  /* الكوكبة */
  .heart-fill { fill: var(--rose); fill-opacity: 0; stroke: none; transition: fill-opacity 2s ease; }
  .seg {
    fill: none;
    stroke: var(--pearl);
    stroke-opacity: .55;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    transition: stroke-dashoffset 1s ease, stroke 1.2s ease, stroke-opacity 1.2s ease;
  }
  .seg.on { stroke-dashoffset: 0; }
  .dot { fill: var(--pearl); opacity: 0; transition: opacity .5s ease, fill 1.2s ease; }
  .dot.on { opacity: .75; }

  .star .halo { fill: url(#halo); opacity: 0; transition: opacity 1s ease; }
  .star .dim { fill: var(--mist); opacity: .45; transition: opacity .4s ease; }
  .star .spark {
    fill: var(--pearl);
    opacity: 0;
    transform: scale(.2) rotate(-45deg);
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .9s cubic-bezier(.2, .9, .3, 1.25), opacity .5s ease, fill 1.2s ease;
  }
  .star.lit .halo { opacity: 1; }
  .star.lit .dim { opacity: 0; }
  .star.lit .spark { opacity: 1; transform: none; }

  .done .seg { stroke: var(--rose); stroke-opacity: .85; }
  .done .dot { fill: var(--rose); }
  .done .spark { fill: var(--rose-soft); }
  .done .star .halo { fill: url(#haloRose); }
  .done .heart-fill { fill-opacity: .15; animation: breathe 6s ease-in-out 2s infinite; }
  @keyframes breathe { 0%, 100% { fill-opacity: .1; } 50% { fill-opacity: .2; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="field" id="field" aria-hidden="true"></div>

<main class="stage">
  <section class="panel" id="panel" aria-live="off"></section>
  <figure class="constellation">
    <svg id="const" viewBox="0 0 400 400" role="img" aria-label="كوكبة على شكل قلب، بتتكوّن نجمة نجمة مع كل إجابة"></svg>
  </figure>
</main>

<script>
(function () {
  // اسمها ولقبها اللي بيتنادى بيهم في الصفحة
  var NAME = "رغد";
  var NICK = "نمولتي";
  var FROM = "يوسف";
  var addr = NICK || NAME || "حبيبتي";

  var QUESTIONS = [
    { q: "أحلى وقت في اليوم عندك؟", opts: [
      ["الفجر، والدنيا لسه هادية", "الفجر بيخلّينا نسمع الحاجات الصغيرة. وده شبهك."],
      ["بعد المطر", "بعد المطر الدنيا بتبقى أهدى وريحتها أحلى. يرب بقي اليوم الي نبقي فيه ساعتها مع بعض تحت المطر."],
      ["الغروب", "الغروب بيخلّي أي مكان أحلى. زيك بالظبط."],
      ["الليل، لما الدنيا تنام", "الليل عندي ليه أغنية مخصوصة: يا حلوة بليل."]
    ]},
    { q: "لو هتسافري بكرة من غير ما تخططي، هتروحي فين؟", opts: [
      ["البحر", "البحر واسع كفاية لكل أحلامك."],
      ["جبال الألب", "من فوق كل حاجة بتبان أهدى. وإنتِ بتهدّي الدنيا حواليّا."],
      ["مدينة مهجورة", "حتى المدينة المهجورة هتبقى مليانة حياة لو إنتِ فيها."],
      ["أي مكان، المهم الطريق يبقى حلو", "أحيانًا الطريق أحلى من المكان نفسه."]
    ]},
    { q: "أكتر أكلة بتاخدك من الدنيا؟", opts: [
      ["شاورما", "فل. الشاورما مش أكل، دي عهد. وأنا على العهد.", "ملحوظة: الشاورما عليا."],
      ["مكرونة بشاميل", "فل. صينية بشاميل ومعاها حد بتحبيه، مفيش أحلى من كده.", "ملحوظة: لازم أدوّقك من المكرونة بشاميل اللي أنا بعملها."],
      ["بيتزا", "فل. أي أكلة معاكي بتبقى أحلى.", "ملحوظة: بتحبي بيتزا إيه بالضبط؟"],
      ["حاجة حلوة", "فل بس اول حته ليا.", "ملحوظة: قوليلي إيه هي وأنا أجيبها."]
    ]},
    { q: "لو كان عندك قوة خارقة، هتختاري إيه؟", opts: [
      ["أوقّف الوقت", "أنا كمان كنت هختار كده. في لحظات كتير كنت عايزها تطوّل."],
      ["أطير", "خديني معاكي، أنا هشيل الشنط."],
      ["الاختفاء", "بس بشرط متختفيش مني."],
      ["أفرّح أي حد زعلان", "إنتِ بتعمليها أصلًا من غير قوة خارقة."]
    ]},
    { q: "إيه اللي بيضحّكك من قلبك؟", opts: [
      ["مواقف عبيطة من غير سبب", "هجمع منها كتير علشان أشوف ضحكتك."],
      ["إفيه في وقته", "هحاول أبقى في المستوى."],
      ["حاجة صغيرة وطريفة، زي كتكوت", "فل. هبدأ أدوّر على كتاكيت."],
      ["ضحكة حد بحبه", "ده بالظبط اللي بحسّه لما إنتِ بتضحكي."]
    ]},
    { q: "إيه أحلى هدية ممكن حد يديهالك؟", opts: [
      ["حاجة صغيرة فكّر فيا وهو بيشتريها", "التفصيلة الصغيرة بتقول كل حاجة."],
      ["مفاجأة من غير مناسبة", "فل. أنا شايف إنها أحلى نوع."],
      ["وقت حلو معاه من غير زحمة", "الوقت أغلى هدية. وأنا بحاول أدّيكي منه أكتر."],
      ["كلمة حلوة تيجي في وقتها", "فل. سيبيني أقولها كمان في الآخر."]
    ]}
  ];

  var TOTAL = QUESTIONS.length;
  var FOOD = 2; // رقم سؤال الأكل (يبدأ من صفر)
  var answers = [];
  var AR = function (n) { return n.toLocaleString("ar-EG"); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- سماء الخلفية ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rand = rng(7);
  var field = document.getElementById("field");
  for (var n = 0; n < 110; n++) {
    var s = document.createElement("i");
    var size = rand() < 0.85 ? 1 : 2;
    var o = (0.25 + rand() * 0.55).toFixed(2);
    s.style.cssText = "left:" + (rand() * 100).toFixed(2) + "%;top:" + (rand() * 100).toFixed(2) +
      "%;width:" + size + "px;height:" + size + "px;--o:" + o + ";opacity:" + o;
    if (rand() < 0.18) {
      s.className = "tw";
      s.style.animationDelay = (rand() * 6).toFixed(1) + "s";
      s.style.animationDuration = (4 + rand() * 4).toFixed(1) + "s";
    }
    field.appendChild(s);
  }

  /* ---------- شكل القلب ---------- */
  var N = 36, STEP = 6;
  function raw(t) {
    return [16 * Math.pow(Math.sin(t), 3),
      13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
  }
  var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (var a = 0; a < 720; a++) {
    var r = raw(a / 720 * 2 * Math.PI);
    if (r[0] < minX) minX = r[0]; if (r[0] > maxX) maxX = r[0];
    if (r[1] < minY) minY = r[1]; if (r[1] > maxY) maxY = r[1];
  }
  var sc = Math.min(320 / (maxX - minX), 320 / (maxY - minY));
  var mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
  var P = [];
  for (var k = 0; k < N; k++) {
    var q = raw(Math.PI + k * 2 * Math.PI / N);
    P.push([200 + (q[0] - mx) * sc, 200 - (q[1] - my) * sc]);
  }
  var f = function (v) { return v.toFixed(1); };

  var svg = document.getElementById("const");
  var h = '<defs>' +
    '<radialGradient id="halo"><stop offset="0" stop-color="#F6E8C6" stop-opacity=".42"/><stop offset="1" stop-color="#F6E8C6" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="haloRose"><stop offset="0" stop-color="#E8909F" stop-opacity=".5"/><stop offset="1" stop-color="#E8909F" stop-opacity="0"/></radialGradient>' +
    '</defs>';
  h += '<path class="heart-fill" d="M' + P.map(function (p) { return f(p[0]) + " " + f(p[1]); }).join(" L") + ' Z"/>';
  for (var sg = 1; sg <= TOTAL; sg++) {
    var from = (sg - 1) * STEP, d = "";
    for (var j = 0; j <= STEP; j++) {
      var p = P[(from + j) % N];
      d += (j ? "L" : "M") + f(p[0]) + " " + f(p[1]) + " ";
    }
    h += '<path class="seg" id="seg' + sg + '" pathLength="1" d="' + d + '"/>';
    for (var j2 = 1; j2 < STEP; j2++) {
      var pp = P[from + j2];
      h += '<circle class="dot seg' + sg + 'd" cx="' + f(pp[0]) + '" cy="' + f(pp[1]) +
        '" r="1.7" style="transition-delay:' + (j2 * 0.14).toFixed(2) + 's"/>';
    }
  }
  for (var i = 0; i < TOTAL; i++) {
    var sp = P[i * STEP];
    h += '<g class="star" id="star' + i + '" transform="translate(' + f(sp[0]) + " " + f(sp[1]) + ')">' +
      '<circle class="halo" r="26"/><circle class="dim" r="2.4"/>' +
      '<path class="spark" d="M0-11Q1.7-1.7 11 0Q1.7 1.7 0 11Q-1.7 1.7-11 0Q-1.7-1.7 0-11Z"/></g>';
  }
  svg.innerHTML = h;

  function drawSeg(n) {
    document.getElementById("seg" + n).classList.add("on");
    svg.querySelectorAll(".seg" + n + "d").forEach(function (el) { el.classList.add("on"); });
  }
  function light(i) {
    document.getElementById("star" + i).classList.add("lit");
    if (i > 0) drawSeg(i);
  }
  function resetSky() {
    svg.classList.remove("done");
    svg.querySelectorAll(".on,.lit").forEach(function (el) { el.classList.remove("on", "lit"); });
  }

  /* ---------- الشاشات ---------- */
  var panel = document.getElementById("panel");
  var idx = 0;

  function swap(fn) {
    panel.classList.add("out");
    setTimeout(function () {
      fn();
      panel.classList.remove("out");
      var t = panel.querySelector('[tabindex="-1"]');
      if (t) t.focus({ preventScroll: true });
    }, reduce ? 0 : 260);
  }

  function renderIntro() {
    idx = 0;
    answers = [];
    panel.innerHTML =
      '<h1 class="display" tabindex="-1">جهّزتلك حاجة صغيرة، يا ' + addr + '</h1>' +
      '<p class="lead">ست أسئلة عنك. مفيش إجابة غلط، اختاري أول حاجة تحسّيها.</p>' +
      '<button class="cta" id="start" type="button">ابدأي</button>';
    document.getElementById("start").addEventListener("click", function () { swap(function () { renderQuestion(0); }); });
  }

  function renderQuestion(i) {
    idx = i;
    var item = QUESTIONS[i];
    var html = '<p class="progress">سؤال ' + AR(i + 1) + ' من ' + AR(TOTAL) + '</p>' +
      '<h2 class="display q" id="q" tabindex="-1">' + item.q + '</h2>' +
      '<div class="opts" role="group" aria-labelledby="q">';
    item.opts.forEach(function (o, n) {
      html += '<button class="opt" type="button" data-n="' + n + '">' + o[0] + '</button>';
    });
    html += '</div><p class="reaction" id="reaction" aria-live="polite"></p><div class="slot" id="slot"></div>';
    panel.innerHTML = html;

    var locked = false;
    var opts = panel.querySelector(".opts");
    panel.querySelectorAll(".opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (locked) return;
        locked = true;
        answers[i] = +btn.dataset.n;
        opts.classList.add("locked");
        btn.classList.add("chosen");
        var r = document.getElementById("reaction");
        r.textContent = item.opts[+btn.dataset.n][1];
        r.classList.add("show");
        light(i);
        setTimeout(function () {
          var slot = document.getElementById("slot");
          slot.innerHTML = '<button class="cta" id="next" type="button">' +
            (i === TOTAL - 1 ? "شوفي الكوكبة" : "كمّلي") + '</button>';
          var nx = document.getElementById("next");
          nx.addEventListener("click", function () {
            if (i < TOTAL - 1) swap(function () { renderQuestion(i + 1); });
            else finale();
          });
          nx.focus();
        }, reduce ? 0 : 900);
      });
    });
  }

  function finale() {
    panel.classList.add("out");
    setTimeout(function () {
      panel.innerHTML = "";
      drawSeg(TOTAL);
    }, reduce ? 0 : 300);
    setTimeout(function () { svg.classList.add("done"); }, reduce ? 0 : 1600);
    setTimeout(function () {
      var pick = QUESTIONS[FOOD].opts[answers[FOOD]] || [];
      var ps = pick[2] || "";
      panel.innerHTML =
        '<h2 class="display" tabindex="-1">الكوكبة اكتملت</h2>' +
        '<p class="lead">الكوكبة دي اسمها ' + (NAME || addr) + '.</p>' +
        '<div class="letter">' +
        '<p>' + addr + '، مفيش مناسبة النهارده، ولا حاجة حصلت. أنا بس عايزك تعرفي إن الأيام العادية بقت أحلى من ساعة ما بقيتي فيها.</p>' +
        '<p>شكرًا إنك بتسمعيني، وبتضحكي معايا، وبتخلّي الدنيا أحلى وليها طعم.</p>' +
        '<p>وأنا مش محتاج سبب علشان أقولك: بحبك.</p>' +
        '</div>' +
        (ps ? '<p class="ps">' + ps + '</p>' : '') +
        '<p class="sign">' + FROM + '</p>' +
        '<button class="ghost" id="again" type="button">من الأول</button>';
      document.getElementById("again").addEventListener("click", function () {
        panel.classList.add("out");
        setTimeout(function () { resetSky(); renderIntro(); panel.classList.remove("out"); window.scrollTo(0, 0); }, reduce ? 0 : 300);
      });
      panel.classList.remove("out");
      var t = panel.querySelector('[tabindex="-1"]');
      if (t) t.focus({ preventScroll: true });
    }, reduce ? 0 : 3400);
  }

  renderIntro();
})();
</script>
</body>
</html>
